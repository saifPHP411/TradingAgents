name: Temporary Ruff import-sort diagnostic

on:
  push:
    branches:
      - high-winrate-selective-mr
    paths:
      - ".github/workflows/ruff-import-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff and show exact safe import fixes
        run: |
          python -m pip install ruff
          ruff check tradingagents/crypto/backtest/perpetual_bollinger_forward.py --fix || true
          git diff -- tradingagents/crypto/backtest/perpetual_bollinger_forward.py
          ruff check tests/test_perpetual_bollinger_forward.py --fix || true
          git diff -- tests/test_perpetual_bollinger_forward.py
