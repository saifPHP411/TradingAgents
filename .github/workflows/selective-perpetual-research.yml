name: Manual selective perpetual strategy research

on:
  workflow_dispatch:
    inputs:
      exclude_after:
        description: "Exact UTC timestamp marking the previously inspected final holdout start (ISO-8601, e.g. 2026-01-01T00:00:00+00:00)"
        required: true
        type: string
      days:
        description: "Maximum history lookback in days"
        required: true
        default: "730"
        type: string

permissions:
  contents: read

concurrency:
  group: selective-perpetual-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Bybit 4h selective Bollinger RSI research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests python-dotenv pydantic

      - name: Validate holdout cutoff and run fixed research tournament
        env:
          EXCLUDE_AFTER: ${{ inputs.exclude_after }}
          DAYS: ${{ inputs.days }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import os
          import pandas as pd
          cutoff = pd.Timestamp(os.environ["EXCLUDE_AFTER"])
          if cutoff.tzinfo is None:
              raise SystemExit("exclude_after must include an explicit timezone")
          days = int(os.environ["DAYS"])
          if not 180 <= days <= 3650:
              raise SystemExit("days must be between 180 and 3650")
          print(f"Using previously inspected holdout cutoff: {cutoff.tz_convert('UTC').isoformat()}")
          PY
          python -m tradingagents.crypto.backtest.perpetual_strategy_lab \
            --symbols BTCUSDT ETHUSDT SOLUSDT BNBUSDT \
            --days "$DAYS" \
            --warmup-bars 260 \
            --test-bars 200 \
            --leverage 1 2 \
            --exclude-after "$EXCLUDE_AFTER" \
            --output artifacts/perpetual_strategy_lab.json

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selective-perpetual-strategy-research
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
