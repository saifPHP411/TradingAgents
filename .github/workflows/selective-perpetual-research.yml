name: Selective perpetual strategy research

on:
  push:
    branches:
      - high-winrate-selective-mr
  workflow_dispatch:
    inputs:
      days:
        description: "Maximum history lookback in days"
        required: true
        default: "730"
        type: string

permissions:
  contents: read

concurrency:
  group: selective-perpetual-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Binance USD-M archive 4h selective Bollinger RSI research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests python-dotenv pydantic

      - name: Verify Binance Vision historical archive access
        run: |
          python - <<'PY'
          import requests
          base = "https://data.binance.vision/data/futures/um/monthly"
          samples = [
              f"{base}/klines/BTCUSDT/4h/BTCUSDT-4h-2026-10.zip",
              f"{base}/markPriceKlines/BTCUSDT/4h/BTCUSDT-4h-2026-10.zip",
              f"{base}/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2026-10.zip",
              "https://data.binance.vision/data/futures/um/daily/markPriceKlines/BTCUSDT/4h/BTCUSDT-4h-2026-06-30.zip",
          ]
          for url in samples:
              response = requests.get(
                  url, headers={"Range": "bytes=0-0"}, stream=True, timeout=20
              )
              print(response.status_code, url)
              if response.status_code not in (200, 206):
                  raise SystemExit(
                      f"Binance Vision archive is unavailable: HTTP {response.status_code}"
                  )
              response.close()
          print("All three historical archive types are reachable.")
          PY


      - name: Validate lookback and run full-history exploratory tournament
        env:
          DAYS: ${{ inputs.days || '730' }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import os
          days = int(os.environ["DAYS"])
          if not 180 <= days <= 3650:
              raise SystemExit("days must be between 180 and 3650")
          PY
          python -m tradingagents.crypto.backtest.perpetual_strategy_lab \
            --data-source binance-vision \
            --symbols BTCUSDT ETHUSDT SOLUSDT BNBUSDT \
            --days "$DAYS" \
            --warmup-bars 260 \
            --test-bars 200 \
            --leverage 1 2 \
            --output artifacts/perpetual_strategy_lab.json

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selective-perpetual-strategy-research
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
