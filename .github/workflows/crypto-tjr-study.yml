name: Crypto TJR historical study

on:
  push:
    branches:
      - bybit-demo-integration
    paths:
      - ".github/workflows/crypto-tjr-study.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-tjr-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv

      - name: Fetch 30 days of public Binance candles
        run: |
          python -m tradingagents.crypto.backtest.fetch \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --limit 43200 \
            --cache ./crypto-cache

      - name: Run unchanged TJR study with realistic costs
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.run \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --periods 7 30 \
            --cache ./crypto-cache \
            --no-sensitivity \
            --out artifacts/crypto_tjr_study.json \
            --markdown artifacts/crypto_tjr_study.md

      - name: Upload study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tjr-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
