name: Crypto TJR historical study

on:
  push:
    branches:
      - bybit-demo-integration
      - demo-ready-dashboard-2026
    paths:
      - ".github/workflows/crypto-tjr-study.yml"
      - "tradingagents/crypto/**"
      - "tradingagents/tjr/**"
      - "tradingagents/paper_experiment/dashboard/**"
      - "tests/**"
  pull_request:
    branches:
      - demo-ready-dashboard-2026
    paths:
      - ".github/workflows/crypto-tjr-study.yml"
      - "tradingagents/crypto/**"
      - "tradingagents/tjr/**"
      - "tradingagents/paper_experiment/dashboard/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-tjr-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Fetch 120 days of public Binance candles
        run: |
          python -m tradingagents.crypto.backtest.fetch \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --limit 172800 \
            --cache ./crypto-cache

      - name: Run TJR study with explicit frictionless, realistic and conservative cost scenarios
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.run \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --periods 7 30 \
            --cache ./crypto-cache \
            --no-sensitivity \
            --out artifacts/crypto_tjr_study.json \
            --markdown artifacts/crypto_tjr_study.md

      - name: Run regime-breakout multi-symbol chronological OOS study
        run: |
          python -m tradingagents.crypto.backtest.regime_breakout_study \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --cache ./crypto-cache \
            --warmup-bars 250 \
            --test-bars 100 \
            --out artifacts/regime_breakout_oos.json

      - name: Upload study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tjr-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
