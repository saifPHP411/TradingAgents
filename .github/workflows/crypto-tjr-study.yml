name: Crypto TJR historical study

on:
  push:
    branches:
      - bybit-demo-integration
      - demo-ready-dashboard-2026
    paths:
      - ".github/workflows/crypto-tjr-study.yml"
      - "tradingagents/crypto/**"
      - "tradingagents/tjr/**"
      - "tradingagents/paper_experiment/dashboard/**"
      - "tests/**"
  pull_request:
    branches:
      - demo-ready-dashboard-2026
    paths:
      - ".github/workflows/crypto-tjr-study.yml"
      - "tradingagents/crypto/**"
      - "tradingagents/tjr/**"
      - "tradingagents/paper_experiment/dashboard/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-tjr-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fetch-history:
    name: Fetch bounded multi-timeframe market history
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install data-fetch dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Fetch 14-day BTC/ETH/BNB 1m and 2-year multi-symbol 1h Binance candles
        run: |
          # TJR uses BTC only; regime-breakout requires 1m cache for BTC, ETH and BNB.
          # Keep this fast 14-day multi-timeframe screen separate from the 2-year 1h adaptive study.
          python -m tradingagents.crypto.backtest.fetch \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --interval 1m \
            --limit 20160 \
            --cache ./crypto-cache
          python -m tradingagents.crypto.backtest.fetch \
            --symbols BTC/USDT ETH/USDT BNB/USDT SOL/USDT XRP/USDT DOGE/USDT AVAX/USDT LINK/USDT LTC/USDT BCH/USDT \
            --interval 1h \
            --limit 17520 \
            --cache ./crypto-cache

      - name: Upload immutable market-history cache
        uses: actions/upload-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  tjr-study:
    name: TJR quick cost-scenario screen
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Download the exact fetched market-history cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Run fast 14-day BTC TJR screen with explicit frictionless, realistic and conservative costs
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.run \
            --symbols BTC/USDT \
            --periods 7 14 \
            --cache ./crypto-cache \
            --no-sensitivity \
            --out artifacts/crypto_tjr_study.json \
            --markdown artifacts/crypto_tjr_study.md

      - name: Upload TJR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tjr-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  regime-breakout-study:
    name: Regime-breakout chronological OOS study
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Download the exact fetched market-history cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Run regime-breakout multi-symbol chronological OOS study
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.regime_breakout_study \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --cache ./crypto-cache \
            --warmup-bars 250 \
            --test-bars 100 \
            --out artifacts/regime_breakout_oos.json

      - name: Upload regime-breakout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-breakout-oos-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  adaptive-multi-regime-study:
    name: Adaptive multi-regime chronological OOS study
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backtest dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Download the exact fetched market-history cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Run adaptive multi-symbol chronological OOS study
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.adaptive_study \
            --symbols BTC/USDT ETH/USDT BNB/USDT SOL/USDT XRP/USDT DOGE/USDT AVAX/USDT LINK/USDT LTC/USDT BCH/USDT \
            --cache ./crypto-cache \
            --warmup-bars 1000 \
            --test-bars 200 \
            --spread-bps 2 \
            --out artifacts/adaptive_crypto_oos.json

      - name: Upload adaptive strategy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-crypto-oos-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  turtle-trend-study:
    name: 4h Donchian trend-following chronological OOS study
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Download the exact shared two-year hourly cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Run fixed-rule 4h Donchian trend-following OOS study
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.turtle_trend \
            --symbols BTC/USDT ETH/USDT BNB/USDT SOL/USDT XRP/USDT DOGE/USDT AVAX/USDT LINK/USDT LTC/USDT BCH/USDT \
            --cache ./crypto-cache \
            --warmup-bars 300 \
            --test-bars 180 \
            --out artifacts/turtle_trend_oos.json

      - name: Upload 4h trend-following report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-trend-4h-oos-study
          path: artifacts/turtle_trend_oos.json
          if-no-files-found: warn
          retention-days: 30

  turtle-trend-refinement-study:
    name: 4h Donchian ADX and volume filter comparison
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Download the exact shared two-year hourly cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Compare predeclared trend-breakout filter variants
        run: |
          mkdir -p artifacts
          python -m tradingagents.crypto.backtest.turtle_trend \
            --symbols BTC/USDT ETH/USDT BNB/USDT SOL/USDT XRP/USDT DOGE/USDT AVAX/USDT LINK/USDT LTC/USDT BCH/USDT \
            --cache ./crypto-cache \
            --warmup-bars 300 \
            --test-bars 180 \
            --compare-refinements \
            --out artifacts/turtle_trend_refinements.json

      - name: Upload filter comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-trend-filter-refinements
          path: artifacts/turtle_trend_refinements.json
          if-no-files-found: warn
          retention-days: 30

  ema-vwap-3m-study:
    name: 3-minute EMA9 and session VWAP crossover screen
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused research dependencies
        run: python -m pip install pandas numpy requests python-dotenv pydantic

      - name: Download the exact fetched 1-minute market-history cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Run 3-minute EMA9/VWAP screen with three cost scenarios
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from tradingagents.crypto.backtest.ema_vwap import EmaVwapCosts, run_ema_vwap_study
          from tradingagents.crypto.backtest.history import HistoryCache

          symbols = ["BTC/USDT", "ETH/USDT", "BNB/USDT"]
          cache = HistoryCache("./crypto-cache")
          frames = {symbol: cache.load(symbol, "1m") for symbol in symbols}
          if any(frame is None or len(frame) < 1000 for frame in frames.values()):
              raise SystemExit("incomplete 1-minute history for EMA/VWAP study")
          reports = {
              "frictionless": run_ema_vwap_study(
                  frames, costs=EmaVwapCosts(0, 0, 0)
              ),
              "realistic": run_ema_vwap_study(
                  frames, costs=EmaVwapCosts(10, 1, 2)
              ),
              "conservative": run_ema_vwap_study(
                  frames, costs=EmaVwapCosts(15, 3, 5)
              ),
          }
          Path("artifacts/ema_vwap_3m_study.json").write_text(
              json.dumps(reports, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              scenario: {
                  key: value for key, value in report.items()
                  if key not in {"trade_log", "per_symbol"}
              } | {"per_symbol": report["per_symbol"]}
              for scenario, report in reports.items()
          }, indent=2))
          PY

      - name: Upload EMA/VWAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-vwap-3m-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30


  factor-interaction-study:
    name: Weekly-refit cross-sectional factor-interaction OOS study
    needs: fetch-history
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests python-dotenv pydantic

      - name: Download the exact two-year market-history cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-history-cache
          path: crypto-cache/

      - name: Run purged weekly-refit factor-interaction study
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from tradingagents.crypto.backtest.factor_interaction import (
              FactorCosts, run_factor_interaction_study,
          )
          from tradingagents.crypto.backtest.history import HistoryCache

          symbols = [
              "BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT",
              "DOGE/USDT", "AVAX/USDT", "LINK/USDT", "LTC/USDT", "BCH/USDT",
          ]
          cache = HistoryCache("./crypto-cache")
          frames = {symbol: cache.load(symbol, "1h") for symbol in symbols}
          if any(frame is None or len(frame) < 10000 for frame in frames.values()):
              raise SystemExit("incomplete two-year hourly history for factor study")
          reports = {
              "frictionless": run_factor_interaction_study(
                  frames, costs=FactorCosts(0, 0, 0)
              ),
              "realistic": run_factor_interaction_study(
                  frames, costs=FactorCosts(10, 1, 2)
              ),
              "conservative": run_factor_interaction_study(
                  frames, costs=FactorCosts(15, 3, 5)
              ),
          }
          Path("artifacts/factor_interaction_oos.json").write_text(
              json.dumps(reports, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              scenario: {
                  key: value for key, value in report.items()
                  if key not in {"trade_log", "fold_audit", "per_symbol_trade_metrics"}
              } | {"per_symbol_trade_metrics": report["per_symbol_trade_metrics"]}
              for scenario, report in reports.items()
          }, indent=2))
          PY

      - name: Upload factor-interaction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-interaction-oos-study
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
