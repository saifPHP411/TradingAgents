name: Crypto RAE walk-forward validation

on:
  workflow_dispatch:
    inputs:
      bars:
        description: "Completed Binance Spot 1h bars per symbol"
        required: true
        default: "17520"
      train_bars:
        description: "Historical context bars before each OOS window"
        required: true
        default: "4000"
      test_bars:
        description: "Bars in each non-overlapping OOS window"
        required: true
        default: "720"
      purge_bars:
        description: "No-trade purge gap after training context"
        required: true
        default: "24"
      embargo_bars:
        description: "Additional no-trade embargo gap"
        required: true
        default: "24"
      simulations:
        description: "Hourly block-bootstrap simulations"
        required: true
        default: "2000"

permissions:
  contents: read

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fetch fresh completed Binance Spot hourly candles
        run: |
          python -m tradingagents.crypto.fetch_ensemble_history \
            --bars "${{ inputs.bars }}" \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --cache .research-cache
      - name: Run frozen chronological OOS validation and Monte Carlo
        run: |
          python -m tradingagents.crypto.run_ensemble_walkforward \
            --symbols BTC/USDT ETH/USDT BNB/USDT \
            --cache .research-cache \
            --train-bars "${{ inputs.train_bars }}" \
            --test-bars "${{ inputs.test_bars }}" \
            --purge-bars "${{ inputs.purge_bars }}" \
            --embargo-bars "${{ inputs.embargo_bars }}" \
            --simulations "${{ inputs.simulations }}" \
            --out artifacts/rae_walkforward.json
      - name: Upload OOS report
        uses: actions/upload-artifact@v4
        with:
          name: rae-walkforward-oos-report
          path: artifacts/rae_walkforward.json
          if-no-files-found: error
          retention-days: 90
