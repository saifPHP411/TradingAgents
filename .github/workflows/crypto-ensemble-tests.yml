name: Regime-adaptive ensemble unit tests

on:
  push:
    branches: [research/regime-adaptive-ensemble, rae-portfolio-accounting-audit]
    paths:
      - "tradingagents/crypto/ensemble.py"
      - "tradingagents/crypto/ensemble_backtest.py"
      - "tradingagents/crypto/ensemble_portfolio.py"
      - "tradingagents/crypto/ensemble_walkforward.py"
      - "tests/test_crypto_ensemble.py"
      - "tests/test_crypto_ensemble_backtest.py"
      - "tests/test_crypto_ensemble_portfolio.py"
      - "tests/test_crypto_ensemble_walkforward.py"
      - ".github/workflows/crypto-ensemble-tests.yml"
  pull_request:
    branches: [bybit-demo-integration, research/regime-adaptive-ensemble]
    paths:
      - "tradingagents/crypto/ensemble.py"
      - "tradingagents/crypto/ensemble_walkforward.py"
      - "tradingagents/crypto/run_ensemble_walkforward.py"
      - "tradingagents/crypto/ensemble_backtest.py"
      - "tradingagents/crypto/ensemble_portfolio.py"
      - "tests/test_crypto_ensemble.py"
      - "tests/test_crypto_ensemble_backtest.py"
      - "tests/test_crypto_ensemble_portfolio.py"
      - "tests/test_crypto_ensemble_walkforward.py"
      - ".github/workflows/crypto-ensemble-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run ensemble unit tests
        run: python -m pytest -q tests/test_crypto_ensemble.py tests/test_crypto_ensemble_backtest.py tests/test_crypto_ensemble_portfolio.py tests/test_crypto_ensemble_walkforward.py
