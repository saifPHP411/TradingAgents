name: Crypto RAE historical study

on:
  push:
    branches: [research/regime-adaptive-ensemble]
    paths:
      - ".github/workflows/crypto-ensemble-study.yml"
      - "tradingagents/crypto/ensemble.py"
      - "tradingagents/crypto/ensemble_backtest.py"
      - "tradingagents/crypto/fetch_ensemble_history.py"
      - "tradingagents/crypto/run_ensemble_study.py"
  workflow_dispatch:
    inputs:
      bars:
        description: "Completed 1h bars per symbol (17520 is about two years)"
        required: true
        default: "17520"
      symbols:
        description: "Space-separated Binance Spot symbols"
        required: true
        default: "BTC/USDT ETH/USDT BNB/USDT"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fetch completed public Binance 1h candles
        env:
          STUDY_BARS: ${{ inputs.bars || '17520' }}
          STUDY_SYMBOLS: ${{ inputs.symbols || 'BTC/USDT ETH/USDT BNB/USDT' }}
        run: |
          read -r -a SYMBOLS <<< "$STUDY_SYMBOLS"
          python -m tradingagents.crypto.fetch_ensemble_history \
            --bars "$STUDY_BARS" \
            --symbols "${SYMBOLS[@]}" \
            --cache .research-cache
      - name: Run chronological comparison and 1.5x cost stress
        env:
          STUDY_SYMBOLS: ${{ inputs.symbols || 'BTC/USDT ETH/USDT BNB/USDT' }}
        run: |
          read -r -a SYMBOLS <<< "$STUDY_SYMBOLS"
          python -m tradingagents.crypto.run_ensemble_study \
            --symbols "${SYMBOLS[@]}" \
            --cache .research-cache \
            --out artifacts/rae_study.json
      - name: Fetch 30 days of 1m bars for unchanged TJR baseline
        env:
          STUDY_SYMBOLS: ${{ inputs.symbols || 'BTC/USDT ETH/USDT BNB/USDT' }}
        run: |
          read -r -a SYMBOLS <<< "$STUDY_SYMBOLS"
          python -m tradingagents.crypto.backtest.fetch \
            --limit 43200 \
            --symbols "${SYMBOLS[@]}" \
            --cache .research-cache
      - name: Run unchanged TJR 30-day baseline
        env:
          STUDY_SYMBOLS: ${{ inputs.symbols || 'BTC/USDT ETH/USDT BNB/USDT' }}
        run: |
          read -r -a SYMBOLS <<< "$STUDY_SYMBOLS"
          python -m tradingagents.crypto.backtest.run \
            --symbols "${SYMBOLS[@]}" \
            --periods 30 \
            --cache .research-cache \
            --no-sensitivity \
            --out artifacts/tjr_30d_study.json \
            --markdown artifacts/tjr_30d_study.md
      - name: Upload RAE and TJR study reports
        uses: actions/upload-artifact@v4
        with:
          name: crypto-rae-and-tjr-study
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
