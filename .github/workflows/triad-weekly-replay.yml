name: Donchian15m vs unanimous triad weekly research

on:
  pull_request:
    paths:
      - ".github/workflows/triad-weekly-replay.yml"
      - "tradingagents/crypto/triad_consensus.py"
      - "tradingagents/crypto/triad_live_shadow.py"
      - "tradingagents/crypto/backtest/weekly_candidates.py"
      - "tests/test_triad_consensus.py"
      - "tests/test_triad_live_shadow.py"
      - "tests/test_weekly_candidates.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    name: Sniper + Analyst + Professor safety regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research+realtime dependencies
        run: |
          python -m pip install -e ".[dev,realtime]"
      - name: Strict Ruff on new vote and market stream modules
        run: |
          ruff check tradingagents/crypto/triad_consensus.py \
            tradingagents/crypto/triad_live_shadow.py \
            tradingagents/crypto/backtest/weekly_candidates.py \
            tests/test_triad_consensus.py tests/test_triad_live_shadow.py
      - name: No-network sequential and stale-signal regression tests
        run: |
          python -m pytest -q tests/test_triad_consensus.py \
            tests/test_triad_live_shadow.py tests/test_weekly_candidates.py

  replay:
    name: Read-only frozen Donchian baseline vs triad (${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: focused-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: september-4weeks
            start: "2026-09-06"
            days: 28
          - sample: october-4weeks
            start: "2026-10-04"
            days: 28
          - sample: november-2weeks
            start: "2026-11-01"
            days: 14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch Binance USD-M historical 1m candles and replay same 50-USDT account
        env:
          STUDY_START: ${{ matrix.start }}
          STUDY_DAYS: ${{ matrix.days }}
          SAMPLE_NAME: ${{ matrix.sample }}
        run: |
          python tradingagents/crypto/backtest/weekly_candidates.py \
            --start "$STUDY_START" --days "$STUDY_DAYS" \
            --symbols BTCUSDT ETHUSDT XRPUSDT LTCUSDT \
            --strategies donchian_15m_trend donchian_15m_triad_shadow \
            --output "artifacts/triad-${SAMPLE_NAME}.json"
      - name: Save full simulated trade ledger including every loss and veto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triad-weekly-${{ matrix.sample }}
          path: artifacts/triad-${{ matrix.sample }}.json
          retention-days: 14
          if-no-files-found: warn

  independent-account-audit:
    name: Verify 10 complete seven-day periods, fees, profit and missing exchange evidence
    runs-on: ubuntu-latest
    needs: replay
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download every September October and November trade/equity ledger
        uses: actions/download-artifact@v4
        with:
          pattern: triad-weekly-*
          path: downloaded
          merge-multiple: true
      - name: Run original exact-account weekly goal gate for both policies
        run: |
          python tradingagents/crypto/backtest/weekly_goal_bridge.py \
            --input \
              downloaded/triad-september-4weeks.json \
              downloaded/triad-october-4weeks.json \
              downloaded/triad-november-2weeks.json \
            --output artifacts/triad-vs-original-account-audit.json
      - name: Publish independent account result (no strategy auto-approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triad-vs-original-weekly-evidence
          path: artifacts/triad-vs-original-account-audit.json
          retention-days: 14
          if-no-files-found: warn
